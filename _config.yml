# Site settings
title: Lennart Eing
tagline: Academic website of Lennart Eing
description: >
  Research associate and PhD candidate at the Chair for Human-Centered Artificial Intelligence,
  University of Augsburg. Sign language understanding and sports motion analysis.
url: https://lennarteing.github.io
baseurl: ""

# Hero section on the homepage (_layouts/homelay.html)
author:
  name: Lennart Eing
  url: https://lennarteing.github.io
  photo: images/profile.jpg   # empty = no photo
  email: lennyeing@gmail.com
  links:             # shown as buttons next to Email and CV, in this order
    - { name: Scholar, icon: "ai ai-google-scholar", url: "https://scholar.google.com/citations?user=BaLLYWAAAAAJ&hl=en&oi=ao" }
    - { name: ORCID, icon: "ai ai-orcid", url: "https://orcid.org/0009-0005-8855-7659" }

# Default language for pages without `lang:` (e.g. 404); strings in _data/i18n.yml
lang: en

plugins:
  - jekyll-seo-tag

include:
  - _pages

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Taskfile.yml
  - scripts
  - vendor

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  parse_block_html: true
